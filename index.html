<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ying Shiuan</title>
  <meta name="description" content="Ying Shiuan's personal site. Visit the portfolio at yingshiuan.github.io/yingsc.">
  <!-- Google Search Console: paste the verification meta tag here, e.g.
  <meta name="google-site-verification" content="YOUR_TOKEN"> -->
  <link rel="canonical" href="https://yingshiuan.github.io/">
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #60a5fa; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif; padding: 0 16px;
    }
    main { text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 2rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a {
      display: inline-block; padding: .6rem 1.2rem; border-radius: 8px;
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ying Shiuan</h1>
    <p>Welcome! My portfolio lives here:</p>
    <a href="/yingsc/">Visit my portfolio →</a>
  </main>
</body>
</html>
